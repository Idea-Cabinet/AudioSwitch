[Devices]
; Replace with your active Windows playback endpoint IDs.
DellId=REPLACE_WITH_FIRST_ENDPOINT_ID
HeadphonesId=REPLACE_WITH_SECOND_ENDPOINT_ID

[Hotkey]
; 124 = F13. Modifiers: Alt=1, Ctrl=2, Shift=4; add to combine.
VirtualKey=124
Modifiers=0
; Optional two-key chord: End+PgUp uses VirtualKey=33, ChordKey=35, Modifiers=0.
ChordKey=0

[UI]
ShowTray=1
