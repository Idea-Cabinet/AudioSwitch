[Devices]
; 推荐方式：通过托盘右键菜单【音频设备配置...】直接在图形界面下拉选择，会自动保存以下属性。
; 程序每次切换时会根据 FriendlyName（友好名称）与 Desc（硬件描述）在后台动态解析当前最新的活跃端点 ID，彻底解决开关机/插拔导致 GUID 变化的问题。
Device1Friendly=DELL S2725QS (NVIDIA High Definition Audio)
Device1Desc=DELL S2725QS
Device1Interface=NVIDIA High Definition Audio

Device2Friendly=耳机 (High Definition Audio Device)
Device2Desc=耳机
Device2Interface=High Definition Audio Device

; 兼容字段（可选，保存时会自动同步写入当前活跃的 GUID）
DellId=
HeadphonesId=

[Hotkey]
; 124 = F13. Modifiers: Alt=1, Ctrl=2, Shift=4; add to combine.
VirtualKey=124
Modifiers=0
; Optional two-key chord: End+PgUp uses VirtualKey=33, ChordKey=35, Modifiers=0.
ChordKey=0

[UI]
ShowTray=1
; 切换音频时是否弹出系统通知气泡（1=显示气泡，0=静默切换）
ShowNotification=1
